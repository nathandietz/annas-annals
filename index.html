<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna’s Annals</title><link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="scanner.js" defer></script><script src="config.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">A personal library</p><h1>Anna’s Annals</h1></div><button id="disconnect" class="secondary" hidden>Disconnect</button></header>
    <p id="status" role="status" aria-live="polite">Loading your library…</p>
    <div class="toolbar"><input id="search" type="search" placeholder="Search title, author, or ISBN" aria-label="Search catalog" disabled><div id="library-actions" class="actions" hidden><button id="refresh" class="secondary">Refresh</button><button id="add">Add book</button></div></div>
    <section id="connect" hidden><h2>Your library, in your Sheet</h2><p>Sign in with Google, then choose a spreadsheet you own or that has been shared with you.</p><div class="actions"><button id="signin">Connect Google Sheet</button><button id="choose-sheet" class="secondary" hidden>Choose a different Sheet</button></div><p class="hint">The app requests access only to files you choose to use with it.</p></section>
    <section id="library" hidden>
      <p id="count" class="hint"></p><div id="books" class="books"></div>
    </section>
    <dialog id="editor"><form id="book-form"><div class="dialog-header"><h2>Add a book</h2><button type="button" id="close-editor" class="secondary">Close</button></div>
      <label>ISBN <span class="hint">optional</span><input name="isbn" inputmode="numeric" autocomplete="off"></label>
      <div class="actions"><button type="button" id="scan" class="secondary">Scan barcode</button><button type="button" id="lookup" class="secondary">Look up ISBN</button></div>
      <div id="scan-area" hidden><div id="universal-qr-reader"></div><p id="scan-status" class="hint"></p><label>Or scan a photo<input id="photo" type="file" accept="image/*"></label><button type="button" id="stop-scan" class="secondary">Close scanner</button></div>
      <label>Title <input name="title" required></label><label>Author <input name="author"></label><label>Language <input name="language"></label><label>Notes <textarea name="notes" rows="3"></textarea></label>
      <p id="form-status" role="status" aria-live="polite"></p><button id="save" type="submit">Save book</button>
    </form></dialog>
  </main>
</body></html>
